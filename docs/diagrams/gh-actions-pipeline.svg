<text x="810" y="546" font-size="15" fill="#343a40">Every Azure job reuses:</text>
<text x="810" y="567" font-size="15" fill="#343a40">• setup-foundry  (composite action)</text>
<text x="810" y="588" font-size="15" fill="#343a40">• scripts/ci/lib.sh  (bash functions)</text>
<text x="1060" y="156" font-size="15" fill="#343a40">Only the agent</text>
<text x="1060" y="177" font-size="15" fill="#343a40">whose folder</text>
